name: Profile metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Needs a personal access token stored as the METRICS_TOKEN secret
      # (scopes: read:org, read:user, repo for private stats). See lowlighter/metrics docs.
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdisayyadnahed
          template: classic
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdisayyadnahed
          template: classic
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdisayyadnahed
          template: classic
          filename: metrics.habits.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mehdisayyadnahed
          template: classic
          filename: metrics.achievements.svg
          base: ""
          config_timezone: Asia/Tehran
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
